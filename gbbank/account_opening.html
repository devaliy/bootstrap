<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GB Bank Limited | Landing Page</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg ">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="images/gbbank_logo.png" height="50px">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>


                <div class="collapse navbar-collapse" id="mynavbar">
                    <ul class="navbar-nav me-auto">

                    </ul>

                    <div class="d-flex">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item m-2">
                                <a class="nav-link">
                                    Register
                                </a>
                            </li>

                            <li class="nav-item nav-link">
                                <a class="btn btn-primary text-white">
                                    Login
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <section class="container">
        <div class="body text-center" >
            <img src="images/Account-amico 1.png">
            <h1>Account Opening</h1>
        </div>

        <div class="contact">
        <form>

            <div class="form-group">
                <label for="fullname">Fullname</label>
                <input type="text" class="form-control" id="fullname"
                    placeholder="Enter full name">
               
            </div>
       
            <div class="form-group">
                <label for="ssn">SSN/EIN/ITIN</label>
                <input type="text" class="form-control" id="ssn" placeholder="Enter SSN/EIN/ITIN">
            
            </div>


            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Enter Email">
            
            </div>



            <div class="form-group">
                <label for="id">Attach Government Issued ID</label>
                <input type="file" class="form-control" id="id" >
            
            </div>


            <button type="submit" class="btn btn-primary" >Create</button>

        </form>

        </div>

    </section>
   

    <footer class="container footer">
        <div class="row">
            <div class="col-md-6">
                <img src="images/gbswhite.png" height="50px" width="200px">
            </div>

            <div class="col-md-6 " style="text-align: end;">
                <span>
                    <i class="fa fa-phone " style="margin: 5px:"></i> +1 931 322 2222
                </span>
                <br>
                <span class="icons">
                    <i class="fa-brands fa-facebook-f icons"></i>
                    <i class="fa-brands fa-twitter icons"></i>
                    <i class="fa-brands fa-instagram icons"></i>
                </span>
            </div>

        </div>


        <div class="row">
            <div class="col-md-12" style="border-top: 1px solid white; margin-top: 2rem; padding-top: 1rem;">
                <span>
                    &copy; 2024 GBS Bank
                </span>

            </div>
        </div>

    </footer>
    <script src="bootstrap/js/bootstrap.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"
        integrity="sha512-6sSYJqDreZRZGkJ3b+YfdhB3MzmuP9R7X1QZ6g5aIXhRvR1Y/N/P47jmnkENm7YL3oqsmI6AK+V6AD99uWDnIw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>


</body>

</html>
